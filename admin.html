<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Messages · Suleman Saqib</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A0908'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='52' font-weight='bold' fill='%23D4AF37'>SS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:     #0A0908;
      --bg2:    #100F0D;
      --bg3:    #181614;
      --text:   #E8DFD8;
      --text2:  #9A8A7A;
      --gold:   #D4AF37;
      --bronze: #8C6D4F;
      --green:  #4ade80;
      --red:    #f87171;
      --border: rgba(212,175,55,0.12);
      --glass:  rgba(255,255,255,0.03);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login screen ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(212,175,55,0.06) 0%, transparent 70%);
    }
    .login-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 380px;
      text-align: center;
    }
    .login-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px; letter-spacing: 4px;
      background: linear-gradient(135deg, #D4AF37, #8C6D4F);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .login-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--text2); margin-bottom: 36px;
    }
    .login-card label {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text2); display: block; text-align: left; margin-bottom: 8px;
    }
    .login-card input {
      width: 100%; padding: 13px 16px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; margin-bottom: 18px;
      transition: border-color 0.3s;
    }
    .login-card input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #D4AF37, #8C6D4F);
      border: none; border-radius: 50px;
      color: #0A0908; font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.3s, transform 0.3s;
    }
    .login-btn:hover { opacity: 0.85; transform: translateY(-2px); }
    .login-error {
      color: var(--red); font-size: 12px; margin-top: 14px;
      display: none;
    }

    /* ── Dashboard ── */
    #dashboard { display: none; }

    header {
      background: rgba(10,9,8,0.94);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 40px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 3px;
    }
    .header-logo span { color: var(--gold); }
    .header-right {
      display: flex; align-items: center; gap: 16px;
    }
    .msg-count {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text2);
    }
    .msg-count strong { color: var(--gold); }
    .logout-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text2); background: none; border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 50px; cursor: pointer;
      transition: all 0.3s;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .dashboard-main { padding: 40px; max-width: 1100px; margin: 0 auto; }

    .dash-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px; letter-spacing: 4px;
      background: linear-gradient(135deg, #D4AF37, #8C6D4F);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .dash-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; color: var(--text2); letter-spacing: 1px;
      margin-bottom: 36px;
    }

    /* Stats row */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-bottom: 36px;
    }
    .stat-box {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px 20px;
    }
    .stat-box .n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px; letter-spacing: 2px; line-height: 1;
      background: linear-gradient(135deg, #D4AF37, #8C6D4F);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-box .l {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
      color: var(--text2); margin-top: 6px;
    }

    /* Messages table */
    .table-wrap {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-header h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: var(--text2);
    }
    .refresh-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--gold); background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.18); padding: 7px 16px; border-radius: 50px;
      cursor: pointer; transition: all 0.3s;
    }
    .refresh-btn:hover { background: rgba(212,175,55,0.15); }

    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--text2); padding: 14px 20px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 16px 20px; vertical-align: top;
      border-bottom: 1px solid rgba(212,175,55,0.05);
      font-size: 13px; color: var(--text2); line-height: 1.7;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(212,175,55,0.02); }

    .td-id {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; color: var(--gold); opacity: 0.5;
      white-space: nowrap;
    }
    .td-name { font-weight: 600; color: var(--text); white-space: nowrap; }
    .td-email a { color: var(--gold); text-decoration: none; }
    .td-email a:hover { text-decoration: underline; }
    .td-message { max-width: 400px; color: var(--text2); }
    .td-date {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px; color: var(--text2); white-space: nowrap; opacity: 0.7;
    }
    .reply-btn {
      display: inline-block; margin-top: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--gold); text-decoration: none;
      padding: 5px 12px; border: 1px solid rgba(212,175,55,0.25);
      border-radius: 50px; transition: all 0.3s;
    }
    .reply-btn:hover { background: rgba(212,175,55,0.08); }

    .empty-state {
      padding: 60px 20px; text-align: center; color: var(--text2);
    }
    .empty-state p { font-size: 14px; }

    .loading-state { padding: 60px 20px; text-align: center; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 2px solid rgba(212,175,55,0.15);
      border-top-color: var(--gold);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      header, .dashboard-main { padding-left: 18px; padding-right: 18px; }
      .stats-row { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>

  <!-- ── Login Screen ── -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">SS Admin</div>
      <div class="login-sub">Portfolio Message Inbox</div>
      <label for="admin-key">Admin Secret Key</label>
      <input type="password" id="admin-key" placeholder="Enter your admin secret..." autocomplete="current-password">
      <button class="login-btn" onclick="login()">Access Inbox</button>
      <div class="login-error" id="login-error">Invalid key. Please try again.</div>
    </div>
  </div>

  <!-- ── Dashboard ── -->
  <div id="dashboard">
    <header>
      <div class="header-logo">S<span>S</span> Inbox</div>
      <div class="header-right">
        <span class="msg-count">Total: <strong id="total-count">—</strong></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="dashboard-main">
      <div class="dash-title">Message Inbox</div>
      <div class="dash-sub">All contact form submissions — newest first</div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="n" id="stat-total">—</div>
          <div class="l">Total Messages</div>
        </div>
        <div class="stat-box">
          <div class="n" id="stat-today">—</div>
          <div class="l">Received Today</div>
        </div>
        <div class="stat-box">
          <div class="n" id="stat-latest">—</div>
          <div class="l">Latest Sender</div>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-header">
          <h3>All Submissions</h3>
          <button class="refresh-btn" onclick="loadMessages()">↻ Refresh</button>
        </div>
        <div id="table-body">
          <div class="loading-state">
            <div class="spinner"></div>
            <p style="font-size:12px;color:var(--text2);">Loading messages...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let adminKey = '';

    function login() {
      const input = document.getElementById('admin-key').value.trim();
      if (!input) return;
      adminKey = input;
      loadMessages();
    }

    document.getElementById('admin-key').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    function logout() {
      adminKey = '';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-key').value = '';
      document.getElementById('login-error').style.display = 'none';
    }

    async function loadMessages() {
      try {
        const res  = await fetch(`/api/messages?key=${encodeURIComponent(adminKey)}`);
        const data = await res.json();

        if (res.status === 401) {
          document.getElementById('login-error').style.display = 'block';
          return;
        }

        // Switch to dashboard
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display  = 'block';
        document.getElementById('login-error').style.display = 'none';

        renderStats(data.messages || []);
        renderTable(data.messages || []);
      } catch (err) {
        document.getElementById('login-error').textContent = 'Network error. Is the API running?';
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function renderStats(msgs) {
      const total = msgs.length;
      const today = msgs.filter(m => {
        const d = new Date(m.created_at);
        const now = new Date();
        return d.toDateString() === now.toDateString();
      }).length;
      const latest = msgs[0]?.name?.split(' ')[0] || '—';

      document.getElementById('stat-total').textContent  = total;
      document.getElementById('stat-today').textContent  = today;
      document.getElementById('stat-latest').textContent = latest;
      document.getElementById('total-count').textContent = total;
    }

    function renderTable(msgs) {
      const wrap = document.getElementById('table-body');
      if (msgs.length === 0) {
        wrap.innerHTML = '<div class="empty-state"><p>No messages yet. Share your portfolio!</p></div>';
        return;
      }

      const rows = msgs.map(m => {
        const date = new Date(m.created_at).toLocaleString('en-PK', {
          day: '2-digit', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit',
        });
        const msgPreview = m.message.length > 200
          ? m.message.slice(0, 200) + '…'
          : m.message;

        return `
          <tr>
            <td class="td-id">#${m.id}</td>
            <td class="td-name">${esc(m.name)}</td>
            <td class="td-email">
              <a href="mailto:${esc(m.email)}?subject=Re: Your message on my portfolio">${esc(m.email)}</a>
            </td>
            <td class="td-message">
              ${esc(msgPreview)}
              <br>
              <a href="mailto:${esc(m.email)}?subject=Re: Your message on my portfolio&body=Hi ${esc(m.name)},%0A%0A" class="reply-btn">
                Reply ↗
              </a>
            </td>
            <td class="td-date">${date}</td>
          </tr>
        `;
      }).join('');

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
