<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Suleman Saqib</title>
  <meta name="description" content="404 — The requested asset or route was not found on Suleman Saqib's portfolio.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A0908'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='52' font-weight='bold' fill='%23D4AF37'>SS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(90px, 18vw, 180px);
      letter-spacing: 6px;
      line-height: 0.9;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .error-tag {
      font-family: var(--font-label);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      padding: 5px 18px;
      border-radius: 50px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.22);
      display: inline-block;
      margin-bottom: 24px;
    }
    .error-desc {
      color: var(--text2);
      font-size: 16px;
      max-width: 480px;
      line-height: 1.8;
      margin: 0 auto 36px;
    }
    .error-box {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 48px 40px;
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(20px);
      box-shadow: var(--card-shadow);
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <div class="error-box">
      <div class="error-tag"><i class="fas fa-shield-alt"></i> Route Unresolved // 404</div>
      <h1 class="error-code">404</h1>
      <p class="error-desc">
        The requested endpoint or asset could not be located in this environment. It may have been relocated, purged, or restricted under access control policies.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">
          <i class="fas fa-home"></i> Return to Headquarters
        </a>
        <a href="/#projects" class="btn btn-outline">
          <i class="fas fa-folder-open"></i> Browse Projects
        </a>
      </div>
    </div>
  </div>
</body>
</html>
